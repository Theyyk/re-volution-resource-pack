name: Build and Release

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate resource pack
        shell: bash
        run: |
          test -f pack.mcmeta
          test -d assets/customguimod
          grep -Eq '"pack_format"[[:space:]]*:[[:space:]]*3' pack.mcmeta

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PROJECT_VERSION=$(tr -d '\r\n' < VERSION)
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "VERSION:     ${PROJECT_VERSION}"
          echo "Git tag:     ${TAG_VERSION}"

          if [ -z "${PROJECT_VERSION}" ]; then
            echo "VERSION is empty"
            exit 1
          fi

          if [ "${PROJECT_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Tag version does not match VERSION"
            exit 1
          fi

      - name: Build resource pack ZIP
        shell: bash
        run: |
          ARCHIVE="re-volution-resource-pack-${GITHUB_REF_NAME}.zip"
          FILES=(pack.mcmeta assets)
          if [ -f pack.png ]; then
            FILES+=(pack.png)
          fi
          zip -r "${ARCHIVE}" "${FILES[@]}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-volution-resource-pack-${{ github.ref_name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
            --title "RE:volution Resource Pack ${GITHUB_REF_NAME}" \
            --generate-notes
