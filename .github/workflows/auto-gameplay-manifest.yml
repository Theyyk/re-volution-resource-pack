name: Auto-rollout gameplay manifest

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-gameplay-manifest
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing key configuration
        id: signing-key
        env:
          MANIFEST_SIGNING_KEY_PEM: ${{ secrets.MANIFEST_SIGNING_KEY_PEM }}
        shell: bash
        run: |
          if [ -z "$MANIFEST_SIGNING_KEY_PEM" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "MANIFEST_SIGNING_KEY_PEM is not configured; skipping rollout."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout resource-pack repository
        if: steps.signing-key.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          path: pack
          fetch-depth: 0

      - name: Checkout launcher signer source
        if: steps.signing-key.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: Theyyk/re-volution-client
          ref: main
          path: client-source

      - name: Set up .NET 10
        if: steps.signing-key.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build manifest signer
        if: steps.signing-key.outputs.configured == 'true'
        run: dotnet build client-source/tools/ManifestSigner/ManifestSigner.csproj -c Release

      - name: Resolve latest stable gameplay release
        if: steps.signing-key.outputs.configured == 'true'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 pack/.github/scripts/update-gameplay-manifest.py \
            --envelope pack/client/manifest.production.signed.json \
            --output "$RUNNER_TEMP/manifest.production.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Sign and verify updated production manifest
        if: steps.signing-key.outputs.configured == 'true' && steps.prepare.outputs.changed == 'true'
        env:
          MANIFEST_SIGNING_KEY_PEM: ${{ secrets.MANIFEST_SIGNING_KEY_PEM }}
          KEY_ID: ${{ steps.prepare.outputs.key_id }}
        shell: bash
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/manifest.private.pem"
          public_key="$RUNNER_TEMP/manifest.public.pem"
          printf '%s\n' "$MANIFEST_SIGNING_KEY_PEM" > "$private_key"
          chmod 600 "$private_key"

          python3 - "$KEY_ID" "$public_key" <<'PY'
          import json
          import sys
          from pathlib import Path

          key_id = sys.argv[1]
          output = Path(sys.argv[2])
          data = json.loads(Path('client-source/manifest/trusted-manifest-keys.json').read_text(encoding='utf-8'))
          matches = [item for item in data.get('keys', []) if item.get('keyId') == key_id]
          if len(matches) != 1:
              raise SystemExit(f'Expected one trusted public key for {key_id}, found {len(matches)}')
          if matches[0].get('algorithm') != 'ecdsa-p256-sha256':
              raise SystemExit('Trusted key algorithm mismatch')
          output.write_text(matches[0]['publicKeyPem'] + '\n', encoding='utf-8')
          PY

          dotnet run --project client-source/tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- sign \
            --manifest "$RUNNER_TEMP/manifest.production.json" \
            --private "$private_key" \
            --key-id "$KEY_ID" \
            --output pack/client/manifest.production.signed.json

          dotnet run --project client-source/tools/ManifestSigner/ManifestSigner.csproj -c Release --no-build -- verify \
            --envelope pack/client/manifest.production.signed.json \
            --public "$public_key" \
            --key-id "$KEY_ID"

          rm -f "$private_key" "$public_key"

      - name: Publish updated manifest
        if: steps.signing-key.outputs.configured == 'true' && steps.prepare.outputs.changed == 'true'
        working-directory: pack
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/manifest.production.signed.json
          git diff --cached --quiet && { echo 'No signed manifest change to publish.'; exit 0; }
          git commit -m "chore: rollout gameplay mod v${VERSION}"
          git push origin HEAD:main

      - name: Report no-op
        if: steps.signing-key.outputs.configured == 'true' && steps.prepare.outputs.changed == 'false'
        run: echo "Production manifest already points at gameplay mod v${{ steps.prepare.outputs.version }}."
